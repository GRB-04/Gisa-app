<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gisa — Plataforma de Revisão Sistemática Gratuita</title>
  <meta name="description" content="Gisa: analise, filtre e trie artigos científicos por tema. Detecte duplicatas, gerencie decisões de inclusão/exclusão. 100% gratuito e em português."/>
  
  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#0a0614"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Gisa"/>
  <meta name="application-name" content="Gisa"/>
  <meta name="msapplication-TileColor" content="#0a0614"/>

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json"/>

  <!-- Preconnect and Google Fonts Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet"/>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=33"/>

  <!-- App Icons -->
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
</head>
<body>

<div id="app">

  <!-- ── HEADER / TOP NAVBAR ───────────────────────────────── -->
  <header id="navbar" style="display:none;">
    <div class="navbar-left">
      <div class="navbar-brand" id="navbar-brand-btn">
        <div class="brand-icon">G</div>
        <div class="brand-text">
          <span class="brand-title">Gisa</span>
          <span class="brand-sub">Revisão Sistemática</span>
        </div>
      </div>
    </div>

    <div class="navbar-actions">
      <!-- Direct APK / Desktop App Download Trigger -->
      <button class="btn btn-sm btn-ghost" id="install-app-btn" title="Instalar aplicativo ou Baixar APK">
        📲 Baixar App
      </button>

      <!-- Supabase Cloud Sync & Auth Button -->
      <button class="btn btn-sm btn-ghost" id="cloud-sync-status-btn" title="Status da Nuvem">
        ☁️ Entrar
      </button>

      <!-- User Profile Navbar Pill -->
      <button class="btn btn-sm btn-ghost user-profile-btn" id="user-profile-btn" title="Perfil do Pesquisador">
        👤 Pesquisado...
      </button>

      <!-- Keyboard Shortcuts -->
      <button class="btn btn-sm btn-ghost" id="shortcuts-btn" title="Atalhos do Teclado (Pressione ?)">
        ⌨️ Atalhos ?
      </button>

      <!-- Blind Mode Toggle -->
      <button class="btn btn-sm btn-outline blind-mode-btn" id="blind-mode-btn" title="Modo Cego — Oculte autores e periódicos durante a triagem para evitar viés (Cochrane)">
        👁️ Modo Cego: <span id="blind-status-text">OFF</span>
      </button>
    </div>
  </header>

  <!-- ── MAIN CONTENT (ROUTER OUTLET) ─────────────────────── -->
  <main id="main-content" class="auth-mode">
    <!-- Populated by App.render() -->
  </main>

  <!-- ── FOOTER ────────────────────────────────────────────── -->
  <footer id="app-footer" style="display:none; text-align:center;padding:32px;border-top:1px solid var(--border);color:var(--text-muted);font-size:0.78rem;margin-top:auto;">
    Gisa · Plataforma de revisão sistemática · Arquitetura Híbrida (IndexedDB Local-First + Supabase Cloud)
  </footer>

</div>

<!-- ── SCRIPTS ─────────────────────────────────────────────── -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="console.warn('Supabase CDN indisponível ou bloqueado. A aplicação funcionará em modo Local-First.')"></script>
<script src="js/storage.js?v=33"></script>
<script src="js/supabase_client.js?v=33"></script>
<script src="js/similarity.js?v=33"></script>
<script src="js/parsers.js?v=33"></script>
<script src="js/ai_assistant.js?v=33"></script>
<script src="js/ui.js?v=33"></script>
<script src="js/app.js?v=33"></script>

<!-- Service Worker Registration for PWA / Offline Support -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then((reg) => {
        console.log('Service Worker Gisa registrado com sucesso:', reg.scope);
      }).catch((err) => {
        console.warn('Falha no registro do Service Worker:', err);
      });
    });
  }

  // Navbar brand click → home
  document.getElementById('navbar-brand-btn')?.addEventListener('click', () => {
    if (typeof App !== 'undefined') App.navigate('home');
  });

  // Direct boot check
  if (typeof App !== 'undefined' && App.init) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => App.init());
    } else {
      App.init();
    }
  }
</script>

</body>
</html>
