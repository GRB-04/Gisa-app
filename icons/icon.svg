<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#120c24"/>
      <stop offset="100%" stop-color="#0a0614"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="240" r="140" fill="url(#primaryGrad)" opacity="0.18" filter="url(#glow)"/>

  <!-- Stylized G Icon with Scientific Prism / Lens -->
  <path d="M 256 120 C 180 120 120 180 120 256 C 120 332 180 392 256 392 C 320 392 372 350 388 290 L 260 290 L 260 230 L 440 230 C 442 238 444 247 444 256 C 444 360 360 444 256 444 C 152 444 68 360 68 256 C 68 152 152 68 256 68 C 314 68 366 94 402 136 L 358 178 C 334 144 298 120 256 120 Z" fill="url(#primaryGrad)"/>

  <!-- Microscope / Search Diamond Node -->
  <circle cx="370" cy="150" r="26" fill="url(#accentGrad)" filter="url(#glow)"/>
  <circle cx="370" cy="150" r="12" fill="#ffffff"/>
</svg>
