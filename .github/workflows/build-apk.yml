name: Build Gisa Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Assets (www)
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Accept Android Licenses & Set Permissions
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          chmod +x android/gradlew

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gisa-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release with APK
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: apk-build-${{ github.run_number }}
          name: Gisa APK v1.0.${{ github.run_number }}
          body: |
            ## 📱 Gisa — Aplicativo Android (APK)
            
            Baixe o arquivo **`app-debug.apk`** abaixo para instalar no seu celular Android.
            
            - **Versão:** 1.0.${{ github.run_number }}
            - **Arquitetura:** Universal APK (ARM64 / ARMv7 / x86_64)
            - **Requisitos:** Android 8.0+
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
