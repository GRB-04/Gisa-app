name: Build Gisa Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Assets (www)
        run: npm run build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Capacitor Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "Found APK at: $APK_PATH"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gisa-Debug-APK
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Create GitHub Release (on tag or manual dispatch)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          tag_name: v1.0.${{ github.run_number }}
          name: Gisa Android App v1.0.${{ github.run_number }}
          body: |
            ## 📱 Gisa — Aplicativo Android (APK)
            
            Baixe o arquivo `.apk` anexado abaixo para instalar o Gisa no seu celular Android.
            
            - **Versão:** 1.0.${{ github.run_number }}
            - **Arquitetura:** Universal APK (ARM64 / ARMv7 / x86_64)
            - **Suporte:** Android 8.0+ (Oreo até Android 15)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
