<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gisa — Plataforma de Revisão Sistemática Gratuita</title>
  <meta name="description" content="Gisa: analise, filtre e trie artigos científicos por tema. Detecte duplicatas, gerencie decisões de inclusão/exclusão. 100% gratuito e em português."/>
  
  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#0a0614"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Gisa"/>
  <meta name="application-name" content="Gisa"/>
  <meta name="msapplication-TileColor" content="#0a0614"/>

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json"/>

  <!-- Preconnect and Google Fonts Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet"/>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=25"/>

  <!-- App Icons -->
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
</head>
<body>

<div id="app">

  <!-- ── TOP NAVBAR ─────────────────────────────────────── -->
  <header class="navbar">
    <div class="navbar-brand" id="navbar-brand-btn" title="Ir para a página inicial">
      <div class="navbar-logo">G</div>
      <div>
        <div class="navbar-name">Gisa</div>
        <div class="navbar-tagline">Revisão Sistemática</div>
      </div>
    </div>
    <div class="navbar-spacer"></div>

      <!-- Install / Download APK & Desktop App Button -->
      <button class="btn btn-sm btn-ghost install-app-nav-btn" id="install-app-btn" title="Baixar APK ou Instalar no Computador">
        📲 <span class="nav-btn-text">Baixar App</span>
      </button>

      <!-- Supabase Cloud Sync Button -->
      <button class="btn btn-sm btn-ghost cloud-sync-nav-btn" id="cloud-sync-btn" title="Configurar e Sincronizar Supabase">
        ☁️ <span id="cloud-status-text">Nuvem</span>
        <span id="cloud-status-dot" class="status-dot"></span>
      </button>

      <!-- User Profile Button -->
      <button class="btn btn-sm btn-ghost user-profile-nav-btn" id="user-profile-btn" title="Meu Perfil de Pesquisador">
        <span class="user-avatar-badge" id="nav-user-avatar">👤</span>
        <span class="nav-user-name" id="nav-user-name">Perfil</span>
      </button>

      <!-- Dynamic Gisa Controls (Blind mode toggle, Hotkeys button) injected by App -->
      <button class="btn btn-sm btn-ghost hotkeys-help-btn" id="hotkeys-btn" title="Ver atalhos de teclado (?)">
        ⌨️ Atalhos <kbd>?</kbd>
      </button>
      <button class="btn btn-sm blind-toggle-btn" id="blind-mode-btn" title="Alternar Modo Cego (Blind Mode)">
        👁️ Modo Cego: <span id="blind-status-text">OFF</span>
      </button>
    </div>
  </header>

  <!-- ── MAIN CONTENT ───────────────────────────────────── -->
  <main id="main-content" aria-live="polite">
    <!-- Rendered dynamically by app.js -->
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:16px;">
      <div class="spinner"></div>
      <p style="color:var(--text-secondary);font-size:0.95rem;">Carregando Gisa…</p>
    </div>
  </main>

  <!-- ── FOOTER ─────────────────────────────────────────── -->
  <footer style="text-align:center;padding:32px;border-top:1px solid var(--border);color:var(--text-muted);font-size:0.78rem;margin-top:auto;">
    Gisa · Plataforma de revisão sistemática · Arquitetura Híbrida (IndexedDB Local-First + Supabase Cloud)
  </footer>

</div>

<!-- ── SCRIPTS ─────────────────────────────────────────────── -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="console.warn('Supabase CDN indisponível ou bloqueado. A aplicação funcionará em modo Local-First.')"></script>
<script src="js/storage.js?v=25"></script>
<script src="js/supabase_client.js?v=25"></script>
<script src="js/similarity.js?v=25"></script>
<script src="js/parsers.js?v=25"></script>
<script src="js/ai_assistant.js?v=25"></script>
<script src="js/ui.js?v=25"></script>
<script src="js/app.js?v=25"></script>

<!-- Service Worker Registration for PWA / Offline Support -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then((reg) => {
        console.log('Service Worker Gisa registrado com sucesso:', reg.scope);
      }).catch((err) => {
        console.warn('Falha no registro do Service Worker:', err);
      });
    });
  }

  // Navbar brand click → home
  document.getElementById('navbar-brand-btn').addEventListener('click', () => {
    if (typeof App !== 'undefined') App.navigate('home');
  });
</script>

</body>
</html>
