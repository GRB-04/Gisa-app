<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gisa — Plataforma de Revisão Sistemática Gratuita</title>
  <meta name="description" content="Gisa: analise, filtre e trie artigos científicos por tema. Detecte duplicatas, gerencie decisões de inclusão/exclusão. 100% gratuito e em português."/>
  
  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#0a0614"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Gisa"/>
  <meta name="application-name" content="Gisa"/>
  <meta name="msapplication-TileColor" content="#0a0614"/>

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json"/>

  <!-- Preconnect and Google Fonts Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet"/>

  <!-- Cache Buster & SW Sync Engine -->
  <script>
    const GISA_VERSION = 'v69';
    if (localStorage.getItem('gisa_build_ver') !== GISA_VERSION) {
      localStorage.setItem('gisa_build_ver', GISA_VERSION);
      if ('caches' in window) {
        caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k))));
      }
    }
  </script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=69"/>

  <!-- Critical Inline Styles (Guaranteed Zero-Scroll Wizard Layout) -->
  <style>
    .wizard-main-wrapper {
      display: block !important;
      width: 100% !important;
      padding: 10px 16px 20px !important;
    }
    .wizard-view {
      width: 100% !important;
      max-width: 880px !important;
      margin: 0 auto !important;
      padding: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 12px !important;
    }
    .wz-header {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      flex-wrap: wrap !important;
      gap: 12px !important;
      padding: 0 4px !important;
    }
    .wz-header-left {
      display: flex !important;
      align-items: center !important;
      gap: 12px !important;
    }
    .wz-main-title {
      font-size: 1.25rem !important;
      font-weight: 800 !important;
      color: #f8f5ff !important;
      margin: 0 !important;
    }
    .wz-step-indicator {
      display: inline-flex !important;
      align-items: center !important;
      gap: 8px !important;
      background: #191030 !important;
      padding: 5px 14px !important;
      border-radius: 9999px !important;
      border: 1px solid #33215c !important;
    }
    .wz-card {
      background: #191030 !important;
      border: 1px solid #33215c !important;
      border-radius: 18px !important;
      padding: 18px 24px !important;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4) !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 12px !important;
    }
    .wz-form-grid {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      gap: 10px 14px !important;
      width: 100% !important;
    }
    .wz-field-title { grid-column: 1 / 2 !important; }
    .wz-field-type { grid-column: 2 / 3 !important; }
    .wz-field-desc { grid-column: 1 / -1 !important; }
    @media (max-width: 680px) {
      .wz-form-grid { grid-template-columns: 1fr !important; gap: 8px !important; }
      .wz-field-title, .wz-field-type, .wz-field-desc { grid-column: 1 / -1 !important; }
    }
    .wz-body .input {
      width: 100% !important;
      height: 38px !important;
      padding: 0 12px !important;
      font-size: 0.88rem !important;
      background: #231742 !important;
      border: 1px solid #33215c !important;
      border-radius: 6px !important;
      color: #f8f5ff !important;
    }
    .wz-body textarea.input {
      height: 52px !important;
      min-height: 52px !important;
      padding: 8px 12px !important;
      line-height: 1.35 !important;
      resize: none !important;
    }
    #app-footer {
      display: none !important;
    }
    .wz-footer {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      padding-top: 14px !important;
      border-top: 1px solid rgba(168, 85, 247, 0.2) !important;
      margin-top: 6px !important;
      background: transparent !important;
    }
    .wz-footer .btn {
      height: 40px !important;
      padding: 0 24px !important;
      font-size: 0.88rem !important;
      font-weight: 700 !important;
      border-radius: 9999px !important;
    }
    #wz-next, #wz-finish {
      background: linear-gradient(135deg, #a855f7, #d8b4fe) !important;
      color: #0a0614 !important;
      border: none !important;
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.45) !important;
    }
    #wz-next:hover, #wz-finish:hover {
      transform: translateY(-1px) !important;
      box-shadow: 0 6px 26px rgba(168, 85, 247, 0.65) !important;
    }
  </style>

  <!-- App Icons -->
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
</head>
<body>

<div id="app">

  <!-- ── HEADER / TOP NAVBAR ───────────────────────────────── -->
  <header class="navbar" id="navbar" style="display:none;">
    <div class="navbar-brand" id="navbar-brand-btn" title="Ir para a página inicial">
      <div class="navbar-logo">G</div>
      <div>
        <div class="navbar-name">Gisa</div>
        <div class="navbar-tagline">Revisão Sistemática</div>
      </div>
    </div>

    <div class="navbar-spacer"></div>

    <div class="navbar-controls" id="navbar-controls">
      <!-- User Profile Navbar Pill -->
      <button class="btn btn-sm btn-ghost user-profile-nav-btn" id="user-profile-btn" title="Perfil do Pesquisador">
        <span id="nav-user-avatar" class="user-avatar-badge"></span>
        <span id="nav-user-name" class="nav-user-name">Entrar</span>
      </button>

      <!-- Blind Mode Toggle -->
      <button class="btn btn-sm blind-toggle-btn" id="blind-mode-btn" title="Modo Cego — Oculte autores e periódicos durante a triagem para evitar viés (Cochrane)">
        👁️ Modo Cego: <span id="blind-status-text">OFF</span>
      </button>

      <!-- Universal Menu Button -->
      <button class="btn btn-sm btn-ghost menu-toggle-btn" id="mobile-menu-btn" title="Menu de opções" onclick="window.UI && window.UI.showAppMenuModal && window.UI.showAppMenuModal()">
        <span style="font-size:1.25rem;line-height:1;">☰</span>
      </button>
    </div>
  </header>

  <!-- ── MAIN CONTENT (ROUTER OUTLET) ─────────────────────── -->
  <main id="main-content">
    <div style="min-height:75vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;">
      <div class="spinner" style="width:38px;height:38px;border-width:3px;border-top-color:#a855f7;"></div>
      <div style="font-weight:700;font-size:1.05rem;color:#f8f5ff;letter-spacing:-0.01em;">Iniciando Gisa…</div>
      <small style="color:rgba(255,255,255,0.45);font-size:0.82rem;">Carregando seu banco de dados local</small>
    </div>
  </main>

  <!-- ── FOOTER ────────────────────────────────────────────── -->
  <footer id="app-footer" style="display:none; text-align:center;padding:32px;border-top:1px solid var(--border);color:var(--text-muted);font-size:0.78rem;margin-top:auto;">
    Gisa · Plataforma de revisão sistemática · Arquitetura Híbrida (IndexedDB Local-First + Supabase Cloud)
  </footer>

</div>

<!-- ── SCRIPTS ─────────────────────────────────────────────── -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="console.warn('Supabase CDN indisponível ou bloqueado. A aplicação funcionará em modo Local-First.')"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (typeof window !== 'undefined' && window.pdfjsLib) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>
<script src="js/storage.js?v=69"></script>
<script src="js/supabase_client.js?v=69"></script>
<script src="js/similarity.js?v=69"></script>
<script src="js/jszip.min.js"></script>
<script src="js/parsers.js?v=69"></script>
<script src="js/ai_assistant.js?v=69"></script>
<script src="js/ui.js?v=69"></script>
<script src="js/app.js?v=69"></script>

<!-- Service Worker Registration for PWA / Offline Support -->
<script>
  // PWA Install Event Handler
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    window.__gisaDeferredInstallPrompt = e;
    console.log('PWA Install prompt capturado');
  });

  window.addEventListener('appinstalled', () => {
    window.__gisaDeferredInstallPrompt = null;
    if (typeof UI !== 'undefined' && UI.toast) {
      UI.toast('Gisa foi instalado no computador com sucesso!', 'success');
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js?v=69').then((reg) => {
        reg.update();
        console.log('Service Worker Gisa registrado (v69):', reg.scope);
      }).catch((err) => {
        console.warn('Falha no registro do Service Worker:', err);
      });
    });
  }

  // Navbar brand click → home
  document.getElementById('navbar-brand-btn')?.addEventListener('click', () => {
    if (typeof App !== 'undefined') App.navigate('home');
  });

  // Direct boot check
  if (typeof App !== 'undefined' && App.init) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => App.init());
    } else {
      App.init();
    }
  }
</script>

</body>
</html>
