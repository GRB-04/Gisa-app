<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gisa — Plataforma de Revisão Sistemática Gratuita</title>
  <meta name="description" content="Gisa: analise, filtre e trie artigos científicos por tema. Detecte duplicatas, gerencie decisões de inclusão/exclusão. 100% gratuito e em português."/>
  
  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#0a0614"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Gisa"/>
  <meta name="application-name" content="Gisa"/>
  <meta name="msapplication-TileColor" content="#0a0614"/>

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json"/>

  <!-- Preconnect and Google Fonts Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet"/>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=50"/>

  <!-- App Icons -->
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
</head>
<body>

<div id="app">

  <!-- ── HEADER / TOP NAVBAR ───────────────────────────────── -->
  <header class="navbar" id="navbar" style="display:none;">
    <div class="navbar-brand" id="navbar-brand-btn" title="Ir para a página inicial">
      <div class="navbar-logo">G</div>
      <div>
        <div class="navbar-name">Gisa</div>
        <div class="navbar-tagline">Revisão Sistemática</div>
      </div>
    </div>

    <div class="navbar-spacer"></div>

    <div class="navbar-controls" id="navbar-controls">
      <!-- Direct APK / Desktop App Download Trigger (Desktop) -->
      <button class="btn btn-sm btn-ghost install-app-nav-btn" id="install-app-btn" title="Instalar aplicativo ou Baixar APK">
        📲 <span class="nav-btn-text">Baixar APK</span>
      </button>

      <!-- User Profile Navbar Pill -->
      <button class="btn btn-sm btn-ghost user-profile-nav-btn" id="user-profile-btn" title="Perfil do Pesquisador">
        <span id="nav-user-avatar" class="user-avatar-badge"></span>
        <span id="nav-user-name" class="nav-user-name">Entrar</span>
      </button>

      <!-- Keyboard Shortcuts (Desktop) -->
      <button class="btn btn-sm btn-ghost hotkeys-help-btn" id="hotkeys-btn" title="Atalhos do Teclado (Pressione ?)">
        ⌨️ Atalhos <kbd>?</kbd>
      </button>

      <!-- Blind Mode Toggle (Desktop) -->
      <button class="btn btn-sm blind-toggle-btn" id="blind-mode-btn" title="Modo Cego — Oculte autores e periódicos durante a triagem para evitar viés (Cochrane)">
        👁️ Modo Cego: <span id="blind-status-text">OFF</span>
      </button>

      <!-- Mobile Hamburger Menu Button -->
      <button class="btn btn-sm btn-ghost mobile-menu-toggle-btn" id="mobile-menu-btn" title="Menu de opções" style="display:none;">
        <span style="font-size:1.25rem;line-height:1;">☰</span>
      </button>
    </div>
  </header>

  <!-- ── MOBILE MENU DRAWER ─────────────────────────────────── -->
  <div class="mobile-menu-overlay" id="mobile-menu-overlay" style="display:none;">
    <div class="mobile-menu-drawer" id="mobile-menu-drawer">
      <div class="mobile-menu-header">
        <div class="mobile-menu-user-info" id="mobile-menu-user-info">
          <span id="mobile-user-avatar" class="user-avatar-badge"></span>
          <div>
            <strong id="mobile-user-name" style="color:var(--text-primary);display:block;font-size:0.95rem;">Entrar</strong>
            <span id="mobile-user-email" style="color:var(--text-muted);font-size:0.75rem;"></span>
          </div>
        </div>
        <button class="modal-close" id="close-mobile-menu-btn" aria-label="Fechar menu" style="cursor:pointer;">×</button>
      </div>

      <div class="mobile-menu-items">
        <button type="button" class="mobile-menu-item" id="mobile-profile-btn">
          <span class="m-icon">👤</span> <span>Meu Perfil</span>
        </button>
        <button type="button" class="mobile-menu-item" id="mobile-download-btn">
          <span class="m-icon">📲</span> <span>Baixar APK Android</span>
        </button>
        <button type="button" class="mobile-menu-item" id="mobile-blind-btn">
          <span class="m-icon">👁️</span> <span>Modo Cego: <strong id="mobile-blind-status">OFF</strong></span>
        </button>
        <button type="button" class="mobile-menu-item mobile-menu-logout" id="mobile-logout-btn">
          <span class="m-icon">🚪</span> <span>Sair da Conta</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ── MAIN CONTENT (ROUTER OUTLET) ─────────────────────── -->
  <main id="main-content" class="auth-mode">
    <!-- Populated by App.render() -->
  </main>

  <!-- ── FOOTER ────────────────────────────────────────────── -->
  <footer id="app-footer" style="display:none; text-align:center;padding:32px;border-top:1px solid var(--border);color:var(--text-muted);font-size:0.78rem;margin-top:auto;">
    Gisa · Plataforma de revisão sistemática · Arquitetura Híbrida (IndexedDB Local-First + Supabase Cloud)
  </footer>

</div>

<!-- ── SCRIPTS ─────────────────────────────────────────────── -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="console.warn('Supabase CDN indisponível ou bloqueado. A aplicação funcionará em modo Local-First.')"></script>
<script src="js/storage.js?v=50"></script>
<script src="js/supabase_client.js?v=50"></script>
<script src="js/similarity.js?v=50"></script>
<script src="js/parsers.js?v=50"></script>
<script src="js/ai_assistant.js?v=50"></script>
<script src="js/ui.js?v=50"></script>
<script src="js/app.js?v=50"></script>

<!-- Service Worker Registration for PWA / Offline Support -->
<script>
  // PWA Install Event Handler
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    window.__gisaDeferredInstallPrompt = e;
    console.log('PWA Install prompt capturado');
  });

  window.addEventListener('appinstalled', () => {
    window.__gisaDeferredInstallPrompt = null;
    if (typeof UI !== 'undefined' && UI.toast) {
      UI.toast('Gisa foi instalado no computador com sucesso!', 'success');
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then((reg) => {
        console.log('Service Worker Gisa registrado com sucesso:', reg.scope);
      }).catch((err) => {
        console.warn('Falha no registro do Service Worker:', err);
      });
    });
  }

  // Navbar brand click → home
  document.getElementById('navbar-brand-btn')?.addEventListener('click', () => {
    if (typeof App !== 'undefined') App.navigate('home');
  });

  // Direct boot check
  if (typeof App !== 'undefined' && App.init) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => App.init());
    } else {
      App.init();
    }
  }
</script>

</body>
</html>
